name: Build Yazoni Client 1.21.4

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
      - name: Build 1.21.4
        run: gradle build --no-daemon --stacktrace --refresh-dependencies --console=plain
      - name: Upload 1.21.4 JAR
        uses: actions/upload-artifact@v4
        with:
          name: yazoni-client-1.21.4
          path: versions/1.21.4/build/libs/*.jar
